name: Autonomous Daily Idea Builder

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate specs locally, don't create GitHub repo or update Supabase)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Number of ideas to process (default: 1)"
        type: string
        required: false
        default: "1"
      idea_id:
        description: "Specific Idea ID to build (leave blank for next pending idea)"
        type: string
        required: false
        default: ""
  schedule:
    # Runs daily at 09:00 UTC (11:00 AM CEST)
    - cron: '0 9 * * *'

jobs:
  build:
    name: Execute Daily Idea Builder
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Idea Dump Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate GitHub CLI & Git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "$GH_PAT" | gh auth login --with-token
          git config --global user.name "Autonomous Daily Builder"
          git config --global user.email "autonomous-builder@local.dev"
          gh auth status

      - name: Run Daily Builder Pipeline
        id: run_builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.idea_id }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --idea-id ${{ github.event.inputs.idea_id }}"
          fi
          LIMIT="${{ github.event.inputs.limit || '1' }}"

          echo "Starting daily_builder with limit=$LIMIT, extra_args=$EXTRA_ARGS..."
          python3 daily_builder.py --limit "$LIMIT" $EXTRA_ARGS 2>&1 | tee run.log

      - name: Notify Telegram on Result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            ICON="✅"
            if [ "$JOB_STATUS" != "success" ]; then
              ICON="❌"
            fi
            
            SUMMARY=$(tail -n 8 run.log 2>/dev/null || echo "No run log.")
            TEXT="${ICON} *GitHub Actions: Daily Builder*
*Status:* ${JOB_STATUS}
*Trigger:* ${{ github.event_name }}

\`\`\`
${SUMMARY}
\`\`\`"

            python3 -c "
import os, json, urllib.request

token = os.environ.get('TELEGRAM_BOT_TOKEN')
chat_id = os.environ.get('TELEGRAM_CHAT_ID')
text = '''$TEXT'''

payload = json.dumps({
    'chat_id': chat_id,
    'text': text,
    'parse_mode': 'Markdown'
}).encode('utf-8')

req = urllib.request.Request(
    f'https://api.telegram.org/bot{token}/sendMessage',
    data=payload,
    headers={'Content-Type': 'application/json'}
)
try:
    with urllib.request.urlopen(req) as resp:
        print('Telegram notification sent successfully.')
except Exception as e:
    print('Failed to send Telegram alert:', e)
"
          fi
